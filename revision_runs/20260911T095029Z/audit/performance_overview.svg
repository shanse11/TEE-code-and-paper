  <rect x="726" y="328" width="346" height="330" rx="8" fill="#ffffff" stroke="#cfd7df"/>
  <text x="750" y="360" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">实验覆盖</text>
  <text x="750" y="400" font-family="Arial, sans-serif" font-size="14" fill="#44515c">主性能矩阵</text>
  <rect x="750" y="412" width="258" height="22" rx="3" fill="#2878b5"/><text x="1020" y="428" font-family="Arial, sans-serif" font-size="14" fill="#17324d">27</text>
  <text x="750" y="468" font-family="Arial, sans-serif" font-size="14" fill="#44515c">calldata 对照</text>
  <rect x="750" y="480" width="86" height="22" rx="3" fill="#1f9a72"/><text x="848" y="496" font-family="Arial, sans-serif" font-size="14" fill="#17324d">9</text>
  <text x="750" y="536" font-family="Arial, sans-serif" font-size="14" fill="#44515c">恢复矩阵</text>
  <rect x="750" y="548" width="258" height="22" rx="3" fill="#d17b2f"/><text x="1020" y="564" font-family="Arial, sans-serif" font-size="14" fill="#17324d">48</text>
  <text x="750" y="610" font-family="Arial, sans-serif" font-size="13" fill="#687681">恢复场景：direct / timeout / recover / diagnostics</text>
