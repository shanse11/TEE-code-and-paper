  <circle cx="176" cy="531" r="5" fill="#2878b5"/><circle cx="365" cy="495" r="5" fill="#2878b5"/><circle cx="547" cy="505" r="5" fill="#2878b5"/>
  <polyline points="176,497 365,489 547,509" fill="none" stroke="#1f9a72" stroke-width="3"/>
  <circle cx="176" cy="497" r="5" fill="#1f9a72"/><circle cx="365" cy="489" r="5" fill="#1f9a72"/><circle cx="547" cy="509" r="5" fill="#1f9a72"/>
