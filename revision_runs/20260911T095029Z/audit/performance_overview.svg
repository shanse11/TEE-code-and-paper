  <text x="42" y="424" font-family="Arial, sans-serif" font-size="11" fill="#687681">600</text>
  <text x="164" y="612" font-family="Arial, sans-serif" font-size="12" fill="#44515c">1 KiB</text>
  <text x="350" y="612" font-family="Arial, sans-serif" font-size="12" fill="#44515c">8 KiB</text>
  <text x="532" y="612" font-family="Arial, sans-serif" font-size="12" fill="#44515c">32 KiB</text>
