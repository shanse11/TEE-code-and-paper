<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid TEE-Rollup 本地性能与证据边界概览</title>
  <desc id="desc">展示本地 Hardhat 性能矩阵、测试通过情况以及公网 Blob 与真实 TEE 尚未完成的状态。</desc>
  <rect width="1100" height="700" fill="#f7f8fa"/>
  <rect x="28" y="24" width="1044" height="74" rx="8" fill="#17324d"/>
  <text x="52" y="56" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Hybrid TEE-Rollup 审计概览</text>
  <text x="52" y="82" font-family="Arial, sans-serif" font-size="14" fill="#dce8f2">run 20260911T095029Z · 所有性能数字来自本地 Hardhat Cancun，不代表公网吞吐或真实 Blob 费用</text>

  <rect x="28" y="122" width="325" height="178" rx="8" fill="#ffffff" stroke="#cfd7df"/>
  <text x="52" y="154" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">本地安全证据</text>
  <text x="52" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f7a4d">23 / 23</text>
  <text x="52" y="216" font-family="Arial, sans-serif" font-size="14" fill="#44515c">定向安全回归通过</text>
  <text x="52" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f7a4d">1000</text>
  <text x="136" y="252" font-family="Arial, sans-serif" font-size="14" fill="#44515c">条随机序列完成</text>
  <text x="52" y="278" font-family="Arial, sans-serif" font-size="14" fill="#44515c">27401 次操作 · 22686 次回退状态检查</text>

  <rect x="377" y="122" width="325" height="178" rx="8" fill="#ffffff" stroke="#cfd7df"/>
  <text x="401" y="154" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">离线 Blob / KZG</text>
  <text x="401" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1f7a4d">10 / 10</text>
  <text x="401" y="216" font-family="Arial, sans-serif" font-size="14" fill="#44515c">9 个矩阵批次 + 1 个负例</text>
  <text x="401" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">131072 B</text>
  <text x="401" y="278" font-family="Arial, sans-serif" font-size="14" fill="#44515c">Blob · commitment/proof 各 48 B</text>

  <rect x="726" y="122" width="346" height="178" rx="8" fill="#fffaf0" stroke="#dfc58a"/>
  <text x="750" y="154" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6d4b0e">外部证据边界</text>
  <text x="750" y="190" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#a56700">Sepolia：未完成</text>
  <text x="750" y="220" font-family="Arial, sans-serif" font-size="14" fill="#5f4a26">无 RPC / signer / anchor address</text>
  <text x="750" y="252" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#a56700">真实 TEE：未完成</text>
  <text x="750" y="282" font-family="Arial, sans-serif" font-size="14" fill="#5f4a26">无云凭据 / TDX 实例 / Quote</text>

  <rect x="28" y="328" width="674" height="330" rx="8" fill="#ffffff" stroke="#cfd7df"/>
  <text x="52" y="360" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">batchSize=1 时的本地 p50 任务吞吐</text>
  <text x="52" y="384" font-family="Arial, sans-serif" font-size="12" fill="#687681">单位：tasks/s；每组 5 个样本。横轴为 payload KiB，颜色为并发度。</text>
